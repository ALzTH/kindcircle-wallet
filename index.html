<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Фонд · Стейкинг помощи</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#ffffff; --bg2:#f2f3f5; --text:#0f0f10; --hint:#8a8f98;
    --btn:#2481cc; --btntext:#ffffff; --accent:#2ecc71; --danger:#e74c3c; --border:#e5e7eb;
  }
  body.tg-dark{
    --bg:#17212b; --bg2:#232e3c; --text:#f5f5f5; --hint:#8a97a5;
    --btn:#5288c1; --btntext:#ffffff; --accent:#3ddc84; --border:#2f3b4a;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--text); padding:14px; font-size:15px;
    transition:background .2s,color .2s;
  }
  .card{background:var(--bg2);border-radius:14px;padding:16px;margin-bottom:12px}
  .label{font-size:12px;opacity:.65;letter-spacing:.2px;text-transform:uppercase;font-weight:600}
  .balance{font-size:30px;font-weight:800;margin:6px 0 2px;letter-spacing:-.5px}
  .balance small{font-size:14px;font-weight:600;opacity:.6;margin-left:4px}
  .addr{font-size:11px;opacity:.55;word-break:break-all;font-family:ui-monospace,Menlo,monospace;margin-top:4px}
  input{
    width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--border);
    background:var(--bg);color:var(--text);font-size:15px;margin-bottom:10px;outline:none;
  }
  input:focus{border-color:var(--btn)}
  button{
    width:100%;padding:12px;border-radius:10px;border:none;background:var(--btn);color:var(--btntext);
    font-size:15px;font-weight:600;cursor:pointer;transition:opacity .15s;
  }
  button:active{opacity:.75}
  button.ghost{background:transparent;color:var(--btn);border:1px solid var(--border)}
  .row{display:flex;gap:8px;margin-bottom:10px}
  .row button{flex:1}
  .tx{padding:10px 0;border-bottom:1px solid var(--border)}
  .tx:last-child{border-bottom:none}
  .tx-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .tx-amt{font-weight:700;color:var(--accent);white-space:nowrap}
  .tx-amt.out{color:var(--danger)}
  .tx-date{font-size:11px;opacity:.5}
  .tx-comment{font-size:13px;opacity:.85;margin-top:3px;word-break:break-word}
  .tx-sender{font-size:10px;opacity:.45;word-break:break-all;font-family:ui-monospace,monospace;margin-top:2px}
  .loading{text-align:center;padding:18px;opacity:.6;font-size:13px}
  .err{color:var(--danger);text-align:center;padding:14px;font-size:13px}
  .status{font-size:11px;opacity:.5;text-align:center;margin-top:8px}
</style>
</head>
<body>

  <div class="card">
    <div class="label">Баланс кошелька фонда</div>
    <div class="balance" id="balance">—<small>TON</small></div>
    <div class="addr" id="addr"></div>
    <div class="status" id="balance-status"></div>
  </div>

  <div class="card">
    <div class="label" style="margin-bottom:8px">Поиск перевода по memo</div>
    <input type="text" id="memo" placeholder="memo" autocomplete="off" />
    <div class="row">
      <button onclick="searchByMemo()">Найти</button>
      <button class="ghost" onclick="resetSearch()">Сброс</button>
    </div>
  </div>

  <div class="card">
    <div class="label" style="margin-bottom:8px" id="tx-title">Последние поступления</div>
    <div id="tx-list"><div class="loading">Загрузка…</div></div>
  </div>

<script>
const FUND_ADDRESS = "UQDt7nJmwMEQ1u6NaMmOPicgwkkUPCrQmKdOtbdzBKRzsq-L";
const TONCENTER    = "https://toncenter.com/api/v2";
const TONCENTER_KEY = "";
const FETCH_LIMIT  = 50;
const BALANCE_REFRESH_MS = 30000;

const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  if (tg.colorScheme === "dark") document.body.classList.add("tg-dark");
  tg.onEvent?.("themeChanged", () => {
    document.body.classList.toggle("tg-dark", tg.colorScheme === "dark");
  });
}

function shortAddr(a){
  if(!a) return "—";
  if(a.length <= 14) return a;
  return a.slice(0,6) + "…" + a.slice(-6);
}
function fmtDate(unix){
  if(!unix) return "";
  const d = new Date(unix*1000);
  const now = Date.now();
  const diff = (now - d.getTime())/1000;
  if(diff < 60) return "только что";
  if(diff < 3600) return Math.floor(diff/60) + " мин назад";
  if(diff < 86400) return Math.floor(diff/3600) + " ч назад";
  return d.toLocaleDateString("ru-RU", {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"});
}
function ton(n){ return (n/1e9).toFixed(4).replace(/\.?0+$/, "") ; }
async function api(path, params){
  const url = new URL(TONCENTER + path);
  Object.entries(params||{}).forEach(([k,v]) => url.searchParams.set(k,v));
  if (TONCENTER_KEY) url.searchParams.set("api_key", TONCENTER_KEY);
  const r = await fetch(url.toString(), { cache: "no-store" });
  if(!r.ok) throw new Error("HTTP " + r.status);
  const j = await r.json();
  if(!j.ok) throw new Error(j.error || "API error");
  return j.result;
}

async function loadBalance(){
  const el = document.getElementById("balance");
  const st = document.getElementById("balance-status");
  document.getElementById("addr").textContent = FUND_ADDRESS;
  try{
    const nanotons = await api("/getAddressBalance", { address: FUND_ADDRESS });
    const t = parseInt(nanotons,10) / 1e9;
    el.innerHTML = `${t.toFixed(4).replace(/\.?0+$/,"")}<small>TON</small>`;
    st.textContent = "обновлено " + new Date().toLocaleTimeString("ru-RU");
  }catch(e){
    el.innerHTML = `—<small>TON</small>`;
    st.textContent = "ошибка: " + e.message;
    st.style.color = "var(--danger)";
  }
}

let lastTxs = [];

async function loadTransactions(memoFilter){
  const list = document.getElementById("tx-list");
  const title = document.getElementById("tx-title");
  list.innerHTML = '<div class="loading">Загрузка…</div>';

  try{
    const txs = await api("/getTransactions", {
      address: FUND_ADDRESS,
      limit: FETCH_LIMIT
    });

    let items = [];
    for(const tx of txs){
      const inMsg = tx.in_msg || {};
      const value = parseInt(inMsg.value || "0", 10);
      if(!value) continue;

      const comment = (inMsg.message || "").toString();
      const sender  = inMsg.source || "";

      items.push({
        hash: tx.transaction_id?.hash || "",
        sender,
        amount: value,
        comment,
        time: tx.utime || 0
      });
    }

    if(memoFilter){
      const q = memoFilter.toLowerCase();
      items = items.filter(it => it.comment.toLowerCase().includes(q));
      title.textContent = `Результаты по memo: "${memoFilter}" (${items.length})`;
    }else{
      title.textContent = `Последние поступления (${items.length})`;
    }

    lastTxs = items;

    if(items.length === 0){
      list.innerHTML = '<div class="loading">Ничего не найдено</div>';
      return;
    }

    list.innerHTML = items.map(it => `
      <div class="tx">
        <div class="tx-head">
          <span class="tx-amt">+${ton(it.amount)} TON</span>
          <span class="tx-date">${fmtDate(it.time)}</span>
        </div>
        <div class="tx-comment">${it.comment ? "💬 " + escapeHtml(it.comment) : "<i style='opacity:.5'>без комментария</i>"}</div>
        <div class="tx-sender">от ${escapeHtml(shortAddr(it.sender))}</div>
      </div>
    `).join("");
  }catch(e){
    list.innerHTML = `<div class="err">Ошибка: ${escapeHtml(e.message)}</div>`;
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function searchByMemo(){
  const v = document.getElementById("memo").value.trim();
  loadTransactions(v);
}
function resetSearch(){
  document.getElementById("memo").value = "";
  loadTransactions("");
}

loadBalance();
loadTransactions("");
setInterval(loadBalance, BALANCE_REFRESH_MS);
setInterval(() => {
  if(!document.getElementById("memo").value.trim()){
    loadTransactions("");
  }
}, BALANCE_REFRESH_MS);
</script>
</body>
</html>
